[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceforensics"
version = "0.1.0"
description = "Forensic-grade audio deepfake / voice-spoof detection engine (defensive security)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VoiceForensics" }]
keywords = ["deepfake", "anti-spoofing", "audio", "forensics", "security"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "reportlab>=4.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
crepe = ["torchcrepe>=0.0.22"]
whisper = ["transformers>=4.40"]
postgres = ["psycopg2-binary>=2.9"]
s3 = ["boto3>=1.34"]
celery = ["celery>=5.3", "redis>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "fakeredis>=2.20"]

[project.scripts]
voiceforensics = "voiceforensics.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceforensics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
